<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - AME Praia Grande</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- SDK do Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Script do Aplicação -->
    <script src="app.js"></script>
</head>

<body class="login-body">

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Ícone e título -->
            <div class="login-logo" style="background-color: #f0fdf4; border-color: #86efac;">
                <i class="fa-solid fa-lock-open" style="color: #16a34a;"></i>
            </div>
            <h2>Criar Nova Senha</h2>
            <p class="login-subtitle">Digite e confirme a nova senha para sua conta</p>

            <!-- Mensagens de feedback -->
            <div id="reset-error" class="error-alert" style="display: none;"></div>
            <div id="reset-success" class="success-alert" style="display: none;"></div>

            <!-- Estado: token inválido ou expirado -->
            <div id="reset-invalid-token" style="display: none; text-align: center; padding: 1rem 0;">
                <div style="font-size: 2.5rem; margin-bottom: 1rem;">⛔</div>
                <p style="color: #dc2626; font-weight: 600; margin-bottom: 0.5rem;">Link inválido ou expirado</p>
                <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">
                    Este link de redefinição já foi usado ou expirou.<br>Solicite um novo link na tela de login.
                </p>
                <a href="login.html" class="btn-login" style="text-decoration: none; display: inline-flex;">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Voltar ao Login</span>
                </a>
            </div>

            <!-- Formulário de nova senha (visível apenas com token válido) -->
            <form id="form-reset-password" style="display: none;">
                <div class="form-group">
                    <label for="new-password">
                        <i class="fa-solid fa-key"></i> Nova Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="new-password" placeholder="Mínimo 6 caracteres"
                            required autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" id="btn-toggle-new-password"
                            aria-label="Mostrar ou ocultar senha">
                            <i class="fa-solid fa-eye" id="toggle-new-password-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">
                        <i class="fa-solid fa-check-double"></i> Confirmar Nova Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-password" placeholder="Repita a nova senha"
                            required autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" id="btn-toggle-confirm-password"
                            aria-label="Mostrar ou ocultar confirmação">
                            <i class="fa-solid fa-eye" id="toggle-confirm-password-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btn-save-password">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Salvar Nova Senha</span>
                </button>
            </form>

            <!-- Estado: carregando / validando token -->
            <div id="reset-loading" style="text-align: center; padding: 2rem 0; color: #64748b;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 1.5rem; color: #1e3a8a;"></i>
                <p style="margin-top: 0.75rem; font-size: 0.9rem;">Validando link de redefinição...</p>
            </div>

            <div class="login-footer" style="margin-top: 1rem;">
                <a href="login.html" class="btn-back-home">
                    <i class="fa-solid fa-arrow-left"></i>
                    Voltar ao Login
                </a>
            </div>

        </div>
    </div>

</body>

</html>
