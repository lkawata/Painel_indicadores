<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Acesso Restrito AME Praia Grande</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <!-- SDK do Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Script do Aplicação -->
    <script src="app.js"></script>
</head>

<body class="login-body">

    <div class="login-wrapper">
        <!-- Login Card -->
        <div class="login-card">
            <div class="login-logo">
                <i class="fa-solid fa-user-lock"></i>
            </div>

            <h2>Acesso Restrito</h2>
            <p class="login-subtitle">Entre com suas credenciais para acessar o painel de indicadores</p>

            <!-- Error message container -->
            <div id="mensagem-erro" class="error-alert"></div>

            <form id="form-login">
                <div class="form-group">
                    <label for="email"><i class="fa-regular fa-envelope"></i> E-mail</label>
                    <input type="email" id="email" placeholder="nome@amepg.fuabc.org.br" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-key"></i> Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Digite sua senha" required
                            autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" id="btn-toggle-password" aria-label="Mostrar ou ocultar senha">
                            <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span>Entrar</span>
                    <i class="fa-solid fa-right-to-bracket"></i>
                </button>

                <!-- Link Esqueci minha senha -->
                <div class="forgot-password-link-wrapper">
                    <button type="button" class="btn-forgot-link" id="btn-show-forgot">
                        <i class="fa-solid fa-unlock-keyhole"></i>
                        Esqueci minha senha
                    </button>
                </div>
            </form>

            <!-- Painel de Redefinição de Senha (oculto por padrão) -->
            <div id="forgot-password-panel" class="forgot-password-panel" style="display: none;">
                <div class="forgot-divider">
                    <span>Redefinição de Senha</span>
                </div>

                <!-- Mensagens de feedback -->
                <div id="forgot-success" class="success-alert" style="display: none;"></div>
                <div id="forgot-error" class="error-alert" style="display: none;"></div>

                <p class="forgot-instructions">
                    <i class="fa-solid fa-circle-info"></i>
                    Informe seu e-mail cadastrado. Enviaremos um link seguro para você criar uma nova senha.
                </p>

                <div class="form-group" style="margin-bottom: 0.75rem;">
                    <label for="forgot-email">
                        <i class="fa-regular fa-envelope"></i> E-mail de Acesso
                    </label>
                    <input type="email" id="forgot-email" placeholder="nome@amepg.fuabc.org.br" autocomplete="email">
                </div>

                <button type="button" class="btn-login btn-reset-send" id="btn-send-reset">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Enviar Link de Redefinição</span>
                </button>

                <button type="button" class="btn-cancel-forgot" id="btn-cancel-forgot">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
            </div>

            <div class="login-footer">
                <span class="btn-back-home" style="cursor: default;">
                    <i class="fa-solid fa-hospital"></i>
                    AME Praia Grande - Portal Interno
                </span>
            </div>
        </div>
    </div>

</body>

</html>
